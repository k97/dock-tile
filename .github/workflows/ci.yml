name: CI

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'website/**'
      - 'vercel.json'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'
      - 'vercel.json'
      - '*.md'
  # Run on demand against any branch — e.g. to exercise the macOS 15 leg before a release.
  workflow_dispatch:
    inputs:
      dock_check:
        description: "Also pin baked legacy tiles to the macOS 15 runner's Dock, screenshot and measure it"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: DockTile
  PROJECT: DockTile.xcodeproj

jobs:
  build-and-test:
    name: Build & Test (macos-26)
    # Use macos-26 beta (Tahoe) to match local development environment
    # Note: This is ARM64 only, beta status, "as-is" with no SLA
    # See: https://github.blog/changelog/2025-09-11-actions-macos-26-image-now-in-public-preview/
    # This is also the ONLY host that can build the project: the main app icon is an Icon Composer
    # `.icon` document, and Xcode 26's actool crashes compiling it on a macOS 15 host
    # ("AssetCatalogAgent closed the connection", verified 2026-10-02 on macos-15 + Xcode 26.2).
    # macOS 15 is tested by `test-macos-15` below, from the products this job builds.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Localization sheets in sync
        run: |
          python3 -I -m unittest discover -s Scripts/l10n -p 'test_*.py'
          python3 -I Scripts/l10n/l10n.py check

      - name: List available Xcode versions
        run: ls -la /Applications/ | grep Xcode || true

      - name: Select Xcode
        run: |
          # Try to use Xcode 26.2 (matches local dev environment)
          # Fall back to latest available Xcode 16.x if not found
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            echo "✅ Using Xcode 26.2 (matches local environment)"
            sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_26.app" ]; then
            echo "✅ Using Xcode 26.0"
            sudo xcode-select -s /Applications/Xcode_26.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            echo "⚠️  Using Xcode 16.2 (fallback)"
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            echo "⚠️  Using Xcode 16.1 (fallback)"
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            echo "⚠️  Using Xcode 16.0 (fallback)"
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          else
            echo "❌ No suitable Xcode found, using system default"
          fi

      - name: Show Xcode and SDK info
        run: |
          xcodebuild -version
          xcrun --show-sdk-path
          xcodebuild -showsdks

      # Cache the resolved SwiftPM checkouts + downloaded binary artifacts (Firebase ships large
      # xcframeworks like grpc as binary targets). A cache hit skips the network download entirely
      # — both a big speed-up and the fix for the flaky "network connection was lost" red builds.
      - name: Cache SwiftPM dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ./build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('DockTile.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # Resolve up front with retries so a transient artifact-download blip (cache miss) retries
      # instead of failing the whole build. The build step below then reuses ./build/SourcePackages.
      - name: Resolve Swift packages (retry on flaky downloads)
        run: |
          for attempt in 1 2 3 4; do
            echo "📦 Resolving package dependencies (attempt $attempt)…"
            if xcodebuild -project "$PROJECT" -scheme "$SCHEME" \
                 -derivedDataPath ./build -resolvePackageDependencies; then
              exit 0
            fi
            echo "⚠️ Resolve failed (attempt $attempt); retrying in 20s…"
            sleep 20
          done
          echo "❌ Package resolution failed after 4 attempts"
          exit 1

      # macos-26 ships Rust preinstalled (verified against actions/runner-images'
      # macos-26-Readme.md), but pin to stable explicitly and fall back to rustup's own
      # installer in case a future image drops it.
      - name: Ensure Rust toolchain
        run: |
          if command -v rustup >/dev/null 2>&1; then
            echo "✅ rustup found: $(rustup --version)"
            rustup default stable
          else
            echo "⚠️ rustup not found — installing"
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
            source "$HOME/.cargo/env"
          fi
          cargo --version

      # docktile-actool (the vendored actool reimplementation the app bundles — see Task 13 /
      # Scripts/build-compiler.sh) is built from source in CI. Cache its target dir + the cargo
      # registry keyed on Cargo.lock so an unchanged crate skips the rebuild entirely (mirrors
      # the SwiftPM cache above).
      - name: Cache Rust build (docktile-actool)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Vendor/actool/target
            ~/.cargo/registry
          key: ${{ runner.os }}-actool-cargo-${{ hashFiles('Vendor/actool/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-actool-cargo-

      - name: Build icon compiler (docktile-actool)
        run: ./Scripts/build-compiler.sh

      # Guards the compiler defect fix the whole declarative-icons feature depends on.
      - name: Run icon compiler crate tests
        run: |
          cd Vendor/actool
          cargo test

      - name: Build Debug
        run: |
          set -o pipefail
          xcodebuild \
            -project $PROJECT \
            -scheme $SCHEME \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED='NO' \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tee build.log | xcpretty --color || (cat build.log && exit 1)

      - name: Verify app bundle
        run: |
          echo "=== Build Products Directory ==="
          find ./build/Build/Products -type d -name "*.app" || echo "No .app found"

          # Debug builds produce "Dock Tile Dev.app", Release builds produce "Dock Tile.app"
          APP_PATH=$(find ./build/Build/Products -name "Dock Tile*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "❌ App bundle not found!"
            echo "Build directory contents:"
            ls -laR ./build/Build/Products/ || true
            exit 1
          fi

          echo "✅ Found app at: $APP_PATH"
          echo "=== Contents ==="
          ls -la "$APP_PATH/Contents/"
          ls -la "$APP_PATH/Contents/MacOS/" || echo "MacOS folder empty or missing"

          # Check for any executable in MacOS folder
          if ls "$APP_PATH/Contents/MacOS/"* 1> /dev/null 2>&1; then
            echo "✅ Executable found"
            ls -la "$APP_PATH/Contents/MacOS/"
          else
            echo "❌ No executable found in MacOS folder"
            exit 1
          fi

      # A hung test run (2026-10-19: six hours, then 30 min, with NO test output — the test host app
      # never started running tests) must fail fast and leave evidence: if xcodebuild is still running
      # after 15 minutes (a healthy run takes a few), sample every Dock Tile process and xctest,
      # keep the app's diagnostics log, then fail.
      - name: Run Unit Tests
        timeout-minutes: 30
        run: |
          set -o pipefail
          ( xcodebuild test \
              -project $PROJECT \
              -scheme $SCHEME \
              -configuration Debug \
              -destination 'platform=macOS' \
              -derivedDataPath ./build \
              -enableCodeCoverage YES \
              -only-testing:DockTileTests \
              -resultBundlePath TestResults.xcresult \
              CODE_SIGNING_ALLOWED='NO' \
              ENABLE_TESTABILITY=YES \
              2>&1 | tee test.log | xcpretty --color ) &
          TESTS=$!
          for _ in $(seq 1 90); do
            kill -0 "$TESTS" 2>/dev/null || break
            sleep 10
          done
          if kill -0 "$TESTS" 2>/dev/null; then
            echo "::error::Unit tests still running after 15 minutes — sampling the processes"
            mkdir -p hang
            ps -axo pid,etime,%cpu,stat,command | grep -E "Dock Tile|xctest|XCTest|DockTile" | grep -v grep | tee hang/processes.txt
            for pid in $(pgrep -f "Dock Tile Dev|xctest"); do
              sample "$pid" 5 -file "hang/sample-$pid.txt" || true
            done
            cp "$HOME/Library/Application Support/DockTile-Dev/diagnostics.log" hang/ 2>/dev/null || true
            kill "$TESTS" 2>/dev/null || true
            pkill -f "Dock Tile Dev" || true
            exit 1
          fi
          wait "$TESTS" || (cat test.log && exit 1)

      - name: Upload Build Log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: |
            build.log
            test.log
            hang/
            TestResults.xcresult

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DockTile-Debug
          path: ./build/Build/Products/Debug/Dock Tile*.app
          retention-days: 7

      # Products for the macOS 15 leg: the test host app + xctest bundle + .xctestrun, built here
      # (incremental on the DerivedData above) and run on a macOS 15 host with
      # `test-without-building`. Tarred, not zipped: upload-artifact drops symlinks, which would
      # break the embedded frameworks (Sparkle's Versions/A layout). dSYMs excluded for size.
      - name: Build for testing (macOS 15 leg)
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project $PROJECT \
            -scheme $SCHEME \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath ./build \
            CODE_SIGNING_ALLOWED='NO' \
            ENABLE_TESTABILITY=YES \
            2>&1 | tee build-for-testing.log | xcpretty --color || (cat build-for-testing.log && exit 1)
          ls ./build/Build/Products/*.xctestrun
          tar --exclude='*.dSYM' -czf test-products.tgz -C ./build/Build Products

      - name: Upload test products
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-products
          path: test-products.tgz
          retention-days: 1

  test-macos-15:
    name: Unit Tests (macos-15, test-without-building)
    # The frozen legacy icon path (`IconPipeline.isDeclarative == false`: the 4-variant .icns bake +
    # IconStyleManager detection) runs ONLY on macOS 15, and no dev Mac is on 15 — this leg is the
    # only place it executes under test. The project cannot be built here (see build-and-test), so
    # the products built on macos-26 are run with `test-without-building`; the image ships Xcode
    # 26.x, so the same toolchain drives the run. Must be green before a release that still
    # supports macOS 15 is merged.
    needs: build-and-test
    runs-on: macos-15

    steps:
      # Several suites read the SOURCE tree through `#filePath` (the string catalogs, the SF
      # Symbol literal sweep, project.pbxproj, helper fixtures). GitHub lays every runner out at
      # the same /Users/runner/work/<repo>/<repo> path, so a checkout here makes those compiled-in
      # paths resolve on this host too. Without it 11 tests fail with missing files (run 36952618762).
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-products

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          sw_vers
          xcodebuild -version

      - name: Unpack test products
        run: |
          tar -xzf test-products.tgz
          ls Products/*.xctestrun

      - name: Run Unit Tests (without building)
        timeout-minutes: 30
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -xctestrun "$(ls Products/*.xctestrun | head -1)" \
            -destination 'platform=macOS' \
            -only-testing:DockTileTests \
            2>&1 | tee test-macos-15.log | xcpretty --color || (cat test-macos-15.log && exit 1)

      # xcpretty swallows Swift Testing's per-test lines, so a green run prints one line and a
      # run that executed zero tests looks identical. Count the raw log and insist on the suite.
      - name: Prove the suite ran on macOS 15
        run: |
          PASSED=$(grep -c "^Test case .* passed" test-macos-15.log || true)
          FAILED=$(grep -c "^Test case .* failed" test-macos-15.log || true)
          echo "macOS 15: $PASSED passed, $FAILED failed"
          if [ "$PASSED" -lt 600 ]; then
            echo "::error::Only $PASSED tests passed on macOS 15; the suite is ~680. Did the test host launch?"
            exit 1
          fi

      - name: Upload Test Log
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-macos-15
          path: test-macos-15.log

  dock-check-macos-15:
    name: Dock render check (macos-15, on demand)
    # End-to-end evidence for the legacy `.icns` geometry: bake tiles with the real generator ON
    # a macOS 15 host, pin them to that runner's Dock as stub bundles, screenshot the Dock and
    # measure every icon's width (Scripts/ci/dock-check.sh). A full-bleed tile reads ~1.24× its
    # neighbours; the check fails above 1.10×. Opt-in via the `dock_check` dispatch input because
    # it rewrites the runner's Dock. Artifacts: dock.png, dock-window.png, measure.txt.
    if: github.event_name == 'workflow_dispatch' && inputs.dock_check
    needs: build-and-test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download test products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-products

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          sw_vers
          xcodebuild -version

      - name: Unpack test products
        run: tar -xzf test-products.tgz

      - name: Bake legacy tile icons on this host
        run: |
          set -o pipefail
          mkdir -p "$PWD/dock-check/fixtures"
          TEST_RUNNER_DOCKTILE_ICNS_FIXTURE_DIR="$PWD/dock-check/fixtures" \
          xcodebuild test-without-building \
            -xctestrun "$(ls Products/*.xctestrun | head -1)" \
            -destination 'platform=macOS' \
            -only-testing:DockTileTests/LegacyIcnsDockFixtureTests \
            2>&1 | tee bake.log | xcpretty --color || (cat bake.log && exit 1)
          ls -lR dock-check/fixtures

      - name: Pin the tiles to the Dock, capture and measure
        run: Scripts/ci/dock-check.sh "$PWD/dock-check"

      - name: Upload Dock capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dock-check-macos-15
          path: |
            dock-check/dock-before.png
            dock-check/dock.png
            dock-check/dock-window.png
            dock-check/measure.txt
          retention-days: 14
